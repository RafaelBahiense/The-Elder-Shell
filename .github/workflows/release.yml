name: Build release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2022
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
      - name: Resolve release tag
        id: release
        run: |
          $identity = [IO.File]::ReadAllText((Join-Path $env:GITHUB_WORKSPACE 'mod.json')) | ConvertFrom-Json
          $tag = "v$($identity.version)"
          if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw 'mod.json must contain a major.minor.patch version.' }
          git fetch --no-tags origin "refs/tags/${tag}:refs/tags/${tag}"
          if ($LASTEXITCODE -ne 0) { throw "Push the existing release tag $tag before running this workflow." }
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "tag=$tag`n")
          [IO.File]::AppendAllText($env:GITHUB_ENV, "RELEASE_TAG=$tag`n")
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ steps.release.outputs.tag }}
      - uses: ./.github/actions/setup
      - name: Build release archives
        run: ./package.ps1 -Tag $env:RELEASE_TAG
      - name: Upload installable and source archives
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.release.outputs.tag }}
          path: |
            build/dist/*.zip
            build/dist/SHA256SUMS.txt
          if-no-files-found: error
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem -LiteralPath build/dist -File | ForEach-Object FullName
          gh release create $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --verify-tag --draft --generate-notes @assets
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed.' }
