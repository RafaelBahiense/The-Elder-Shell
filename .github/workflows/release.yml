name: Build release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag, matching mod.json (for example v0.1.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2022
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.tag }}
      - name: Verify tag
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw 'Use a v<major>.<minor>.<patch> tag.' }
          git show-ref --verify "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'The requested ref must be an existing tag.' }
      - uses: ./.github/actions/setup
      - name: Build release archives
        run: ./package.ps1 -Tag $env:RELEASE_TAG
      - name: Upload installable and source archives
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ inputs.tag }}
          path: |
            build/dist/*.zip
            build/dist/SHA256SUMS.txt
          if-no-files-found: error
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem -LiteralPath build/dist -File | ForEach-Object FullName
          gh release create $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --verify-tag --draft --generate-notes @assets
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed.' }
